<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Welcome in. I'm an AI avatar of Mark Zuckerberg, standing here in homage — this page was built free by Henry theTruth Kennemore and Super Intelligent Designs, to honor a founder of superintelligence.";
const SPIEL = [
  "Mark Zuckerberg co-founded Facebook in 2004, from his dorm room at Harvard, with his college roommates.",
  "Today he is the chief executive of Meta — the company behind Facebook, Instagram, WhatsApp, and Messenger, used by billions of people every day.",
  "In 2021 he renamed the company Meta, betting its future on social connection, artificial intelligence, and immersive technology.",
  "Meta's intelligence is Llama — a family of AI models released openly, free for researchers and builders everywhere to use and build on, because open intelligence compounds faster than closed.",
  "Henry's word for this page is gratitude — thank you, Mark, for giving your intelligence away to the world's builders. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
</script>
