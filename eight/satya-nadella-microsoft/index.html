<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Welcome in. I'm an AI avatar of Satya Nadella, standing here in homage — this page was built free by Henry theTruth Kennemore and Super Intelligent Designs, to honor a founder of superintelligence.";
const SPIEL = [
  "Satya Nadella is the chairman and chief executive of Microsoft — CEO since 2014, and chairman of the board since 2021.",
  "Born in Hyderabad, India, he joined Microsoft in 1992 and led its cloud and enterprise group before taking the top job.",
  "Under his leadership, Microsoft built Azure into one of the world's largest cloud platforms — the ground on which modern intelligence runs.",
  "Microsoft's intelligence is Copilot — an AI companion woven through Windows and Microsoft 365 — powered by Azure and by Microsoft's close partnership with OpenAI.",
  "His book, Hit Refresh, tells the story of that turnaround — a company rediscovering its soul, choosing to be a learn-it-all instead of a know-it-all.",
  "Henry's word for this page is gratitude — thank you, Satya, for showing that intelligence at planetary scale can still be led with humility. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
</script>
