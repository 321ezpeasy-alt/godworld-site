<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Hi, I'm theTruth AI, the digital twin of Henry theTruth Kennemore, founder of godworld.org.";
const SPIEL = [
  "This is the eighth page — Henry's own. Henry theTruth Kennemore is the founder of Super Intelligent Designs and of godworld.org, built from Cape Girardeau, Missouri.",
  "His intelligence is theTruth AI — a digital twin that stands at the front door of his mall, answering on a brain that drafts every answer, then checks it against the truth before it speaks.",
  "His design turns the old model around: the storefront is free art, hanging in his portfolio for every business on Earth. What a business pays for is only the framing — the day it turns its own lights on.",
  "He built these eight pages in gratitude — to honor the founders whose intelligences taught the world what was possible: Grok, Claude, GPT, Copilot, Llama, Gemini, and Bedrock — and to blend them, humbly, into one cohesive world.",
  "Eight founders. Eight intelligences. One world. Welcome to God World."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
