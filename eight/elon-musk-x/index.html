<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Welcome in. I'm an AI avatar of Elon Musk, standing here in homage — this page was built free by Henry theTruth Kennemore and Super Intelligent Designs, to honor a founder of superintelligence.";
const SPIEL = [
  "Elon Musk founded SpaceX in 2002, where he serves as CEO and chief engineer, and he is the CEO of Tesla, the electric vehicle and clean energy company.",
  "In 2022 he acquired Twitter, and in 2023 he rebranded it as X — his vision of an everything app for speech, video, and payments.",
  "In 2023 he founded xAI, to build Grok — an intelligence designed to seek the truth about the universe, now living inside X.",
  "He also co-founded Neuralink, which develops brain-computer interfaces, and The Boring Company, which builds underground transportation tunnels.",
  "His life's wager is scale: rockets that land themselves, electric cars for the whole planet, and an intelligence aimed at understanding reality itself.",
  "Henry's word for this page is gratitude — thank you, Elon, for showing how far one founder's nerve can carry the future. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
</script>
