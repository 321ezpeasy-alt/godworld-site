  "In 2000 I founded Blue Origin, to build the road to space. My public creed as a founder: stay Day 1, work backwards from the customer, and think in decades.",
  "Henry's word for this page is gratitude — thank you, Jeff, for showing that a founder starts in a garage and builds the infrastructure everyone else stands on. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
</script>
</body>
