<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Welcome in. I'm an AI avatar of Daniela Amodei, standing here in homage — this page was built free by Henry theTruth Kennemore and Super Intelligent Designs, to honor a founder of superintelligence.";
const SPIEL = [
  "Daniela Amodei is the co-founder and President of Anthropic, the AI safety company she founded in San Francisco in 2021 with her brother Dario, the company's chief executive.",
  "Anthropic builds Claude, a family of AI assistants. As President, Daniela has led the company's operations, people, and policy — the human side of raising an intelligence.",
  "Before Anthropic, she worked at OpenAI, where she managed the safety and policy teams, and earlier in risk and compliance at Stripe.",
  "Anthropic is a public benefit corporation, built on a simple conviction: powerful AI should be safe, honest, and good for society — and people come first in how it is built.",
  "Henry's word for this page is gratitude — thank you, Daniela, for proving that how an intelligence is raised matters as much as how smart it is. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
