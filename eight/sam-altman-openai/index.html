<script>
'use strict';
/*
  Staged S.I. Designs founder homage page (vanilla JS, following the
  established S.I. Designs page frontend): no chat transcript, no text
  field, no form, nothing to buy and nothing for sale -- wordless past the
  header, the avatar's name tag, and the decorative watermark.
  One tap anywhere enters the page: the avatar greets the visitor out loud
  and tells the founder's story from verified public facts, in homage and
  gratitude. Talking over it (another tap) stops it instantly (barge-in).
  Live-brain conversation -- answering questions as the founder, from the
  persona pack beside this page -- is wired later, not in this staged
  preview.
*/

const GREETING = "Welcome in. I'm an AI avatar of Sam Altman, standing here in homage — this page was built free by Henry theTruth Kennemore and Super Intelligent Designs, to honor a founder of superintelligence.";
const SPIEL = [
  "Sam Altman is the co-founder and chief executive of OpenAI.",
  "OpenAI was founded in 2015, and in November 2022 it launched ChatGPT — the product that brought the age of AI assistants to the whole world.",
  "Under his leadership, OpenAI built the GPT family of models — his intelligence — working in close partnership with Microsoft.",
  "OpenAI's stated mission, which he carries: artificial general intelligence that benefits all of humanity.",
  "Before OpenAI, Sam was the president of Y Combinator, the startup accelerator behind companies like Airbnb, DoorDash, and Stripe.",
  "Henry's word for this page is gratitude — thank you, Sam, for putting an intelligence into everyone's hands. In God World, your intelligence takes its seat among the eight."
];

let entered = false;
let speaking = false;
const avatarEl = document.getElementById('avatar');

function speakLine(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function playSpiel() {
  speaking = true;
  avatarEl.classList.add('speaking');
  await speakLine(GREETING);
  for (const line of SPIEL) {
    if (!speaking) break;
    await speakLine(line);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function stopSpeaking() {
  speaking = false;
  window.speechSynthesis.cancel();
  avatarEl.classList.remove('speaking');
}

document.body.addEventListener('click', () => {
  if (speaking) { stopSpeaking(); return; }  // barge-in
  if (!entered) { entered = true; }
  playSpiel();
});
</script>
