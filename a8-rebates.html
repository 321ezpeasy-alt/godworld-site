<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>A8 Rebate Processor</title>
<style>
  :root{--bg:#101418;--fg:#f2f4f6;--dim:#9aa3af;--acc:#f79009;--ok:#12b76a;--line:#2a3138}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--dim);font-size:14px;margin:0 0 24px}
  .card{background:#171c22;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
  input{width:100%;background:#0c0f13;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:12px;font-size:16px}
  input:focus{outline:none;border-color:var(--acc)}
  .btn{display:inline-block;background:var(--acc);color:#14100a;border:none;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:8px 14px;font-size:14px;margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .entry{background:#171c22;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .entry.paid{opacity:.55;border-color:#1f6f43}
  .entry .code{font-weight:800;font-size:18px;letter-spacing:.5px}
  .entry .meta{color:var(--dim);font-size:13px;margin:6px 0}
  .entry .amt{font-size:20px;font-weight:800;color:var(--ok)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;margin-left:8px}
  .pill.pending{background:#3a2a10;color:#f79009}.pill.paid{background:#0e3a24;color:#12b76a}
  .empty{color:var(--dim);text-align:center;padding:32px 0}
  .totals{display:flex;gap:18px;margin:8px 0 20px;font-size:14px;color:var(--dim)}
  .totals b{color:var(--fg);font-size:20px}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>A8 Rebate Processor</h1>
  <p class="sub">$100 PayPal rebates, one per verified referral. Data lives only in this browser.</p>

  <div class="card">
    <h2 style="font-size:17px;margin:0 0 4px">Log a rebate</h2>
    <label for="f-code">Seller code</label>
    <input id="f-code" placeholder="A8-XXXXXX" autocomplete="off" style="text-transform:uppercase"/>
    <label for="f-email">Referrer's PayPal-linked email</label>
    <input id="f-email" type="email" placeholder="them@example.com" autocomplete="off"/>
    <label for="f-order">Order reference (from Square)</label>
    <input id="f-order" placeholder="e.g. Square order # / date" autocomplete="off"/>
    <button class="btn" id="add">Add rebate</button>
    <p class="hint">Verify the order in your Square dashboard first. The email must be linked to a PayPal account — that's where the $100 goes.</p>
  </div>

  <div class="totals">
    <div><b id="t-pending">$0</b><br/>pending</div>
    <div><b id="t-paid">$0</b><br/>paid</div>
    <div><b id="t-count">0</b><br/>rebates</div>
  </div>

  <div id="list"></div>
  <div class="row">
    <button class="btn ghost" id="export">Export CSV</button>
    <button class="btn ghost" id="wipe" style="color:#f97066;border-color:#f97066">Clear all</button>
  </div>
</div>

<script>
const KEY='a8_rebates_v1';
const $=id=>document.getElementById(id);
let items=[]; try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const list=$('list'); list.innerHTML='';
  let pend=0,paid=0;
  if(!items.length){list.innerHTML='<div class="empty">No rebates logged yet.</div>'}
  items.slice().reverse().forEach((it,ri)=>{
    const i=items.length-1-ri;
    it.paid?paid+=100:pend+=100;
    const d=document.createElement('div');
    d.className='entry'+(it.paid?' paid':'');
    d.innerHTML=
      '<span class="code">'+esc(it.code)+'</span><span class="pill '+(it.paid?'paid':'pending')+'">'+(it.paid?'PAID':'PENDING')+'</span>'+
      '<div class="meta">'+esc(it.email)+' · '+esc(it.order||'no ref')+' · '+esc(it.date)+'</div>'+
      '<div class="amt">$100.00</div>'+
      '<div class="row">'+
        '<button class="btn ghost" data-a="copy" data-i="'+i+'">Copy payment details</button>'+
        '<button class="btn ghost" data-a="pp" data-i="'+i+'">Open PayPal</button>'+
        (it.paid?'':'<button class="btn ghost" data-a="paid" data-i="'+i+'" style="color:#12b76a;border-color:#12b76a">Mark paid</button>')+
        '<button class="btn ghost" data-a="del" data-i="'+i+'" style="color:#f97066;border-color:#f97066">Delete</button>'+
      '</div>';
    list.appendChild(d);
  });
  $('t-pending').textContent='$'+pend;
  $('t-paid').textContent='$'+paid;
  $('t-count').textContent=items.length;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const i=+b.dataset.i, it=items[i], a=b.dataset.a;
  if(a==='copy'){
    const t='PayPal payment — ARCHANGEL 8 referral rebate\nTo: '+it.email+'\nAmount: $100.00 USD\nNote: A8 referral '+it.code+' ('+(it.order||'no ref')+')';
    navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy payment details',1500)});
  }else if(a==='pp'){
    window.open('https://www.paypal.com/myaccount/transfer/homepage','_blank','noopener');
  }else if(a==='paid'){
    it.paid=true; it.paidAt=new Date().toISOString().slice(0,10); save(); render();
  }else if(a==='del'){
    if(confirm('Delete this rebate record?')){items.splice(i,1);save();render()}
  }
});
$('add').addEventListener('click',()=>{
  const code=$('f-code').value.trim().toUpperCase(), email=$('f-email').value.trim(), order=$('f-order').value.trim();
  if(!/^A8-[A-Z2-9]{6}$/.test(code)){alert('Seller code looks wrong — format is A8-XXXXXX.');return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){alert('Enter a valid PayPal-linked email.');return}
  items.push({code,email,order,date:new Date().toISOString().slice(0,10),paid:false});
  save(); $('f-code').value='';$('f-email').value='';$('f-order').value=''; render();
});
$('export').addEventListener('click',()=>{
  const rows=[['date','seller_code','paypal_email','order_ref','amount_usd','status','paid_at']];
  items.forEach(it=>rows.push([it.date,it.code,it.email,it.order||'',100,it.paid?'paid':'pending',it.paidAt||'']));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='a8-rebates-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
});
$('wipe').addEventListener('click',()=>{
  if(confirm('Clear ALL rebate records? This cannot be undone.')){items=[];save();render()}
});
render();
</script>
</body>
</html>
