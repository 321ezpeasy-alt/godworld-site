<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e11; }
  body { font-family: Georgia, "Times New Roman", serif; color: #eef3f1; }

  /* ============ INTERIOR SCENE (layered) ============ */
  #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(to bottom, #1a2126 0%, #232d33 34%, #2b332e 55%, #171b1d 100%); }
  /* wall panel seams */
  #scene::before { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to right, transparent 0 118px, rgba(0,0,0,0.22) 118px 120px, rgba(255,255,255,0.03) 120px 121px);
    opacity: .5; }
  /* window band: the business's real photo is the view outside */
  #windowband { position: absolute; left: 4%; right: 4%; top: 9%; height: 37%;
    border: 6px solid #10151a; border-radius: 6px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 60px rgba(0,0,0,.35); }
  #windowband img { position: absolute; left: 0; top: 0; width: 112%; height: 112%; max-width: none;
    object-fit: cover; object-position: 42% 50%; filter: saturate(1.05) brightness(1.02);
    animation: panB 46s ease-in-out infinite alternate; }
  @keyframes panB { from { transform: scale(1.13) translate(-2.2%,-1.4%);} to { transform: scale(1.02) translate(0,0);} }
  /* window mullions + glass sheen */
  #windowband::before { content: ""; position: absolute; inset: 0; z-index: 2;
    background: repeating-linear-gradient(to right, transparent 0 calc(25% - 3px), rgba(10,13,16,.85) calc(25% - 3px) 25%); }
  #windowband::after { content: ""; position: absolute; inset: 0; z-index: 3;
    background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 32%); }
  /* passing traffic silhouettes outside the window */
  .car { position: absolute; z-index: 1; bottom: 9%; width: 92px; height: 26px; opacity: .55;
    background: #0d1114; border-radius: 12px 16px 5px 5px;
    box-shadow: 26px -11px 0 -4px #0d1114, 0 0 22px rgba(255,214,140,.12); }
  .car::after { content: ""; position: absolute; right: -14px; top: 9px; width: 16px; height: 5px;
    background: linear-gradient(to right, rgba(255,220,150,.75), transparent); border-radius: 3px; }
  #car1 { animation: drive1 17s linear infinite; }
  #car2 { animation: drive2 26s linear infinite; animation-delay: -11s; transform: scaleX(-1); opacity: .4; }
  @keyframes drive1 { from { left: -14%; } to { left: 106%; } }
  @keyframes drive2 { from { left: 106%; } to { left: -14%; } }
  /* floor with perspective sheen + light pools */
  #floor { position: absolute; left: -10%; right: -10%; bottom: -4%; height: 34%;
    background:
      radial-gradient(ellipse 34% 90% at 22% 0%, rgba(255,196,110,.14), transparent 70%),
      radial-gradient(ellipse 34% 90% at 78% 0%, rgba(255,196,110,.12), transparent 70%),
      repeating-linear-gradient(to right, transparent 0 92px, rgba(0,0,0,.28) 92px 94px),
      linear-gradient(to bottom, #3a3f3a 0%, #262b28 46%, #14181a 100%);
    transform: perspective(420px) rotateX(24deg); transform-origin: top; }
  /* pendant lights */
  .pendant { position: absolute; top: 0; width: 120px; height: 150px; z-index: 2;
    transform-origin: top center; animation: sway 7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-.7deg);} to { transform: rotate(.7deg);} }
  .pendant .cord { width: 2px; height: 74px; margin: 0 auto; background: #0a0d0f; }
  .pendant .shade { width: 54px; height: 26px; margin: 0 auto; background: linear-gradient(to bottom,#39424a,#171c20);
    border-radius: 50% 50% 8px 8px / 100% 100% 8px 8px; }
  .pendant .bulb { width: 14px; height: 14px; margin: -3px auto 0; border-radius: 50%;
    background: radial-gradient(circle, #ffe9bb 0%, #ffc46b 55%, rgba(255,196,107,.0) 78%); }
  .pendant .pool { width: 190px; height: 120px; margin: -6px 0 0 -35px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,203,120,.20), transparent 65%); }
  /* service counter + electrical panels (silhouette furniture) */
  #counter { position: absolute; left: 3.5%; bottom: 6%; width: 21%; min-width: 170px; height: 21%; z-index: 1;
    background: linear-gradient(to bottom, #232a2e 0 12%, #171d20 12% 100%);
    border-top: 5px solid #4a4238; border-radius: 4px; box-shadow: 0 16px 34px rgba(0,0,0,.5); opacity: .92; }
  #counter::before { content: ""; position: absolute; left: 8%; top: 22%; width: 36%; height: 52%;
    border: 2px solid rgba(190,220,255,.20); border-radius: 3px;
    background: repeating-linear-gradient(to bottom, rgba(140,190,255,.13) 0 5px, transparent 5px 13px); }
  #counter::after { content: ""; position: absolute; right: 8%; top: 22%; width: 36%; height: 52%;
    border: 2px solid rgba(255,196,107,.20); border-radius: 3px;
    background: repeating-linear-gradient(to right, rgba(255,196,107,.13) 0 5px, transparent 5px 13px); }
  #shelf { position: absolute; right: 3.5%; bottom: 6%; width: 19%; min-width: 160px; height: 30%; z-index: 1; opacity: .92;
    background:
      repeating-linear-gradient(to bottom, transparent 0 30%, rgba(58,50,40,.95) 30% calc(30% + 5px), transparent calc(30% + 5px) 63%, rgba(58,50,40,.95) 63% calc(63% + 5px), transparent calc(63% + 5px) 96%, rgba(58,50,40,.95) 96% 100%),
      linear-gradient(to right, rgba(20,25,28,.65), rgba(20,25,28,.35)); }
  #shelf::before { content: ""; position: absolute; inset: 6% 8%;
    background:
      radial-gradient(circle 9px at 18% 12%, rgba(255,196,107,.35) 96%, transparent),
      radial-gradient(circle 9px at 52% 12%, rgba(150,200,255,.30) 96%, transparent),
      radial-gradient(circle 9px at 82% 45%, rgba(255,196,107,.30) 96%, transparent),
      radial-gradient(circle 9px at 30% 78%, rgba(150,200,255,.28) 96%, transparent); }
  /* ambient light shift + drifting motes */
  #lightshift { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,190,105,.07), rgba(120,170,255,.05));
    animation: shift 11s ease-in-out infinite alternate; }
  @keyframes shift { from { opacity: .35; } to { opacity: .9; } }
  .mote { position: absolute; z-index: 2; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,230,180,.5); filter: blur(.6px); animation: drift 13s linear infinite; }
  @keyframes drift { from { transform: translateY(12vh); opacity: 0; } 15% { opacity: .8; } 85% { opacity: .7; } to { transform: translateY(-46vh); opacity: 0; } }
  #shade { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(to bottom, rgba(7,10,11,.40) 0%, rgba(7,10,11,0) 24%, rgba(7,10,11,0) 60%, rgba(7,10,11,.48) 100%); }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; text-align: center; padding: 28px 20px 36px;
    background: linear-gradient(to bottom, rgba(7,10,11,.88) 0%, rgba(7,10,11,.55) 65%, rgba(7,10,11,0) 100%); }
  header h1 { font-size: clamp(1.7rem, 4.5vw, 3rem); font-weight: 400; letter-spacing: .04em; line-height: 1.15; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  header .contact { margin-top: 10px; font-size: clamp(1rem, 2.2vw, 1.3rem); letter-spacing: .12em; opacity: .95; text-shadow: 0 1px 10px rgba(0,0,0,.6); }

  /* ============ DYNAMIC AVATAR (portrait technique) ============ */
  #avatar { --level: 0;
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 4;
    height: min(64vh, 660px); aspect-ratio: 1158 / 1358;
    border-radius: 46% 46% 0 0 / 26% 26% 0 0; overflow: hidden;
    border: 1px solid rgba(238,243,241,.35); border-bottom: none;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
    background: #000; cursor: pointer; }
  #avatar .fig { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    animation: breathe 5.2s ease-in-out infinite;
    filter: brightness(calc(1 + var(--level) * .07))
            drop-shadow(0 0 calc(4px + var(--level) * 30px) rgba(160,200,255, calc(var(--level) * .55))); }
  @keyframes breathe { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.007) translateY(-2px); } }
  /* jaw band: second copy of the portrait clipped to the mouth band, offset by live audio level */
  #avatar .jaw { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    clip-path: inset(42% 26% 43% 26%);
    transform: translateY(calc(var(--level) * 4px)) scaleY(calc(1 + var(--level) * .012));
    filter: brightness(.985) blur(.4px); animation: breathe 5.2s ease-in-out infinite; }
  #avatar .bob { position: absolute; inset: 0; transform: translateY(calc(var(--level) * -3px)); }
  /* lightning ripple tracing the figure */
  #ripple { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; }
  #ripple rect { fill: none; stroke: rgba(235,245,255,.95); stroke-width: 2.5;
    stroke-dasharray: 320 2400; stroke-dashoffset: 2720; filter: drop-shadow(0 0 6px rgba(180,215,255,.95)); }
  #avatar.rippling #ripple { opacity: 1; }
  #avatar.rippling #ripple rect { animation: trace 1.5s linear forwards; }
  @keyframes trace { from { stroke-dashoffset: 2720; } to { stroke-dashoffset: 0; } }
  #avatar.rippling .fig { filter: brightness(1.05) drop-shadow(0 0 22px rgba(170,210,255,.65)); }
  /* speaking indicator: icon only (dot + EQ bars), no extra words on screen */
  #speaking { position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%) translateY(6px); z-index: 5;
    display: flex; align-items: flex-end; gap: 3px; padding: 9px 13px; border-radius: 999px;
    background: rgba(7,10,11,.66); border: 1px solid rgba(160,200,255,.4);
    opacity: 0; transition: opacity .18s ease, transform .18s ease; pointer-events: none; }
  #speaking.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #speaking .dot { width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: #5ee07a;
    box-shadow: 0 0 9px rgba(94,224,122,.9); animation: pulse 1s ease-in-out infinite; align-self: center; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.35);} }
  #speaking i { width: 3.5px; height: 4px; background: #9cc6ff; border-radius: 2px; transition: height .07s linear; }

  #nametag { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
    font-family: Helvetica, Arial, sans-serif; font-size: .82rem; letter-spacing: .14em;
    color: #eef3f1; background: rgba(7,10,11,.72); border: 1px solid rgba(238,243,241,.35);
    padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  #sitelink { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 5;
    font-family: Helvetica, Arial, sans-serif; font-size: .95rem; letter-spacing: .06em;
    color: #eef3f1; background: rgba(7,10,11,.78); border: 1px solid rgba(238,243,241,.5);
    padding: 10px 20px; border-radius: 999px; white-space: nowrap; text-decoration: none;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #sitelink:hover { background: rgba(30,40,44,.9); }
  #callbtn { position: fixed; left: 50%; bottom: 114px; transform: translateX(-50%); z-index: 5;
    font-family: Helvetica, Arial, sans-serif; font-size: .95rem; letter-spacing: .06em;
    color: #eef3f1; background: rgba(7,10,11,.78); border: 1px solid rgba(238,243,241,.5);
    padding: 10px 20px; border-radius: 999px; white-space: nowrap; text-decoration: none;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #callbtn:hover { background: rgba(30,40,44,.9); }
</style>

<script>
  const GREETING = "Welcome to Cotner Electric Co, I am theTruth AI. How may I help you today?";
  (function () {
    var avatar = document.getElementById('avatar');
    var audio = document.getElementById('greet');
    var speakingEl = document.getElementById('speaking');
    var bars = speakingEl.querySelectorAll('i');
    var ctx = null, analyser = null, freq = null, level = 0, hold = 0, raf = null, fakeTimer = null;

    function setLevel(v) {
      level = v;
      avatar.style.setProperty('--level', v.toFixed(3));
    }
    function loop() {
      raf = requestAnimationFrame(loop);
      analyser.getByteFrequencyData(freq);
      var sum = 0, n = 0;
      for (var i = 3; i < 90 && i < freq.length; i++) { sum += freq[i]; n++; }
      var raw = Math.min(1, (sum / n) / 165);
      var next = level + (raw - level) * (raw > level ? 0.45 : 0.10);
      setLevel(next);
      if (next > 0.09) hold = 14;
      var on = hold > 0; if (hold > 0) hold--;
      speakingEl.classList.toggle('on', on);
      if (on) for (var b = 0; b < bars.length; b++)
        bars[b].style.height = Math.max(4, (freq[6 + b * 9] / 255) * 16) + 'px';
    }
    function startFake() {           /* fallback if Web Audio is unavailable: envelope-driven level */
      stopFake();
      fakeTimer = setInterval(function () {
        var target = audio.paused ? 0 : 0.25 + Math.random() * 0.55;
        setLevel(level + (target - level) * 0.4);
        speakingEl.classList.toggle('on', !audio.paused);
        for (var b = 0; b < bars.length; b++) bars[b].style.height = (4 + Math.random() * 12) + 'px';
      }, 90);
    }
    function stopFake() { if (fakeTimer) { clearInterval(fakeTimer); fakeTimer = null; } }
    function wire() {
      try {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = ctx.createAnalyser();
          analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.55;
          freq = new Uint8Array(analyser.frequencyBinCount);
          ctx.createMediaElementSource(audio).connect(analyser);
          analyser.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
        if (!raf) loop();
        return true;
      } catch (e) { return false; }
    }
    var played = false;
    function playGreeting() {
      if (played && !audio.paused) return;
      played = true;
      var ok = wire();
      var p = audio.play();
      if (p && p.catch) p.catch(function () { played = false; });
      if (!ok) startFake();
    }
    audio.addEventListener('ended', function () { stopFake(); setLevel(0); speakingEl.classList.remove('on'); });
    /* whole screen is the switch: first touch plays the greeting */
    document.addEventListener('pointerdown', playGreeting);
    avatar.addEventListener('click', playGreeting);
    /* try autoplay; browsers that block it leave it for the first touch */
    playGreeting();
    /* Henry's lightning ripple traces the figure every ~8-10 seconds */
    function ripple() {
      avatar.classList.remove('rippling'); void avatar.offsetWidth;
      avatar.classList.add('rippling');
      setTimeout(function () { avatar.classList.remove('rippling'); }, 1600);
      setTimeout(ripple, 8000 + Math.random() * 2000);
    }
    setTimeout(ripple, 2500);
  })();
</script>
