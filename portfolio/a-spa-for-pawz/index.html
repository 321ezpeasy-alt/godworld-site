<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Spa for Pawz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #120e13; }
  body { font-family: Georgia, "Times New Roman", serif; color: #faf3ec; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 78%, rgba(196,132,122,.30) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(118,168,158,.28) 0%, transparent 65%),
      linear-gradient(168deg, #2a2030 0%, #1b1522 42%, #120e13 72%, #1e1712 100%);
  }
  #backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 22px;
    background: linear-gradient(180deg, rgba(8,5,9,.82) 0%, rgba(8,5,9,.45) 70%, transparent 100%);
  }
  header h1 { font-size: clamp(26px, 5vw, 46px); font-weight: 400; letter-spacing: .02em; line-height: 1.15; }
  .contact { margin-top: 8px; font-size: clamp(15px, 2.4vw, 20px); letter-spacing: .08em; opacity: .92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 2;
    width: clamp(130px, 22vw, 210px); height: clamp(130px, 22vw, 210px); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7a5a6e 0%, #4a3444 55%, #2a1e2a 100%);
    border: 2px solid rgba(250,243,236,.35);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 10px rgba(255,255,255,.04);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
  <h1>A Spa for Pawz</h1>
  <div class="contact">573-803-0840</div>
</header>
<div id="avatar" data-greeting="Hi, welcome to A Spa for Pawz — how can we help you today?"></div>
<script>
  const GREETING = "Hi, welcome to A Spa for Pawz — how can we help you today?";
</script>
</body>
</html>
