<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Tails Boarding, Daycare &amp; Grooming</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1210; }
  body { font-family: Georgia, "Times New Roman", serif; color: #f3f5ec; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 78%, rgba(146,166,92,.28) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 16%, rgba(90,130,120,.30) 0%, transparent 65%),
      linear-gradient(168deg, #1e2e28 0%, #141f1a 42%, #0d1210 72%, #191a12 100%);
  }
  #backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 22px;
    background: linear-gradient(180deg, rgba(4,8,6,.82) 0%, rgba(4,8,6,.45) 70%, transparent 100%);
  }
  header h1 { font-size: clamp(24px, 4.6vw, 42px); font-weight: 400; letter-spacing: .02em; line-height: 1.15; }
  .contact { margin-top: 8px; font-size: clamp(15px, 2.4vw, 20px); letter-spacing: .08em; opacity: .92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 2;
    width: clamp(130px, 22vw, 210px); height: clamp(130px, 22vw, 210px); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a7263 0%, #34493e 55%, #1e2d26 100%);
    border: 2px solid rgba(243,245,236,.35);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 10px rgba(255,255,255,.04);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
  <h1>Happy Tails Boarding, Daycare &amp; Grooming</h1>
  <div class="contact">573-651-1800</div>
</header>
<div id="avatar" data-greeting="Hi, welcome to Happy Tails — how can we help you today?"></div>
<script>
  const GREETING = "Hi, welcome to Happy Tails — how can we help you today?";
</script>
</body>
</html>
