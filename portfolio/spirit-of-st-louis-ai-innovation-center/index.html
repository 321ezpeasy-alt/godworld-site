      "description": "The Spirit of St. Louis AI Innovation Center is a shared digital utility for AI for good, announced on August 26, 2026 and administered by GeoSTL, the St. Louis nonprofit geospatial and AI economic development organization led by Executive Director Mark Munsell. Its founding members are Amazon Web Services (AWS), Google, NVIDIA, Overture Maps Foundation, WEKA, and World Wide Technology (WWT). The Center provides shared high-performance computing and AI resources to researchers, the public sector, startups, and industry, with twenty percent of its capacity dedicated exclusively to civic projects benefiting the greater St. Louis region. It runs the Spirit of St. Louis AI Innovation Competitions across clusters including agriculture technology, advanced manufacturing, bio and health sciences, national security, humanitarian and disaster relief, fintech, and transportation and supply chain logistics, in coordination with partners including Taylor Geospatial, 39 North Agtech Innovation District, the Advanced Manufacturing Innovation Center (AMICSTL), BioSTL, TechSTL, Yield Lab Institute, and the Donald Danforth Plant Science Center.",
