<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrick's Cleaners</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0c1a22; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #eef4f6; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 55% 40% at 18% 78%, rgba(140, 200, 220, 0.16), transparent 70%),
      radial-gradient(ellipse 50% 35% at 84% 68%, rgba(110, 170, 200, 0.13), transparent 70%),
      radial-gradient(ellipse 80% 50% at 50% 112%, rgba(70, 130, 160, 0.18), transparent 70%),
      linear-gradient(160deg, #0a1a24 0%, #14303f 38%, #1d4356 62%, #0e2431 100%);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 22px;
    background: linear-gradient(180deg, rgba(5, 12, 16, 0.88) 0%, rgba(5, 12, 16, 0.55) 70%, rgba(5, 12, 16, 0) 100%);
  }
  header h1 { font-size: clamp(26px, 5vw, 44px); font-weight: normal; letter-spacing: 0.04em; }
  header p { margin-top: 8px; font-size: clamp(15px, 2.4vw, 20px); letter-spacing: 0.12em; opacity: 0.92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 2;
    width: clamp(120px, 22vw, 190px); height: clamp(120px, 22vw, 190px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.30), rgba(255,255,255,0.05) 55%), linear-gradient(150deg, #3f6d84, #22465a);
    border: 2px solid rgba(238, 244, 246, 0.35);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
  <h1>Patrick's Cleaners</h1>
  <p>573-335-0633</p>
</header>
<div id="avatar" data-greeting="Hi, welcome to Patrick's Cleaners — how can we help you today?"></div>
<script>
  const GREETING = "Hi, welcome to Patrick's Cleaners — how can we help you today?";
</script>
</body>
</html>
