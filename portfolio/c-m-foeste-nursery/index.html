<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C M Foeste Nursery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #101a10; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #f5f1e6; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(120, 180, 90, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 35% at 85% 70%, rgba(90, 140, 60, 0.18), transparent 70%),
      radial-gradient(ellipse 80% 50% at 50% 110%, rgba(60, 100, 40, 0.25), transparent 70%),
      linear-gradient(160deg, #16240f 0%, #243a18 38%, #2f4d20 62%, #1a2c12 100%);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 22px;
    background: linear-gradient(180deg, rgba(8, 14, 6, 0.88) 0%, rgba(8, 14, 6, 0.55) 70%, rgba(8, 14, 6, 0) 100%);
  }
  header h1 { font-size: clamp(26px, 5vw, 44px); font-weight: normal; letter-spacing: 0.04em; }
  header p { margin-top: 8px; font-size: clamp(15px, 2.4vw, 20px); letter-spacing: 0.12em; opacity: 0.92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 2;
    width: clamp(120px, 22vw, 190px); height: clamp(120px, 22vw, 190px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.28), rgba(255,255,255,0.05) 55%), linear-gradient(150deg, #4a6b35, #2c4420);
    border: 2px solid rgba(245, 241, 230, 0.35);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
  <h1>C M Foeste Nursery</h1>
  <p>573-335-6247</p>
</header>
<div id="avatar" data-greeting="Hi, welcome to C M Foeste Nursery — how can we help you today?"></div>
<script>
  const GREETING = "Hi, welcome to C M Foeste Nursery — how can we help you today?";
</script>
</body>
</html>
