<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luttrell Moving &amp; Delivery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0f1216; }
  body { font-family: Georgia, "Times New Roman", serif; color: #f5f1e8; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(84, 110, 140, 0.35), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(190, 150, 80, 0.22), transparent 50%),
      linear-gradient(160deg, #1a222c 0%, #12181f 45%, #0b0e12 100%);
  }
  #backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 14px);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 36px;
    background: linear-gradient(to bottom, rgba(8,10,13,0.88) 0%, rgba(8,10,13,0.55) 65%, rgba(8,10,13,0) 100%);
  }
  header h1 { font-size: clamp(1.7rem, 4.5vw, 3rem); font-weight: 400; letter-spacing: 0.04em; line-height: 1.15; }
  header .contact { margin-top: 10px; font-size: clamp(1rem, 2.2vw, 1.3rem); letter-spacing: 0.12em; opacity: 0.92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 1;
    width: clamp(150px, 24vw, 240px); aspect-ratio: 3 / 4; border-radius: 120px 120px 24px 24px;
    background: linear-gradient(180deg, rgba(220,228,238,0.20), rgba(120,140,165,0.12));
    border: 1px solid rgba(245,241,232,0.28);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 0 40px rgba(255,255,255,0.05);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
  <h1>Luttrell Moving &amp; Delivery</h1>
  <div class="contact">573-334-9090</div>
</header>
<div id="avatar" data-greeting="Hi, welcome to Luttrell Moving &amp; Delivery — how can we help you today?"></div>
<script>
  const GREETING = "Hi, welcome to Luttrell Moving & Delivery — how can we help you today?";
</script>
</body>
</html>
