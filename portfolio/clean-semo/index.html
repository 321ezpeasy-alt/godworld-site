<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean SEMO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0e1014; }
  body { font-family: Georgia, "Times New Roman", serif; color: #eef2f5; }
  #backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(60, 100, 150, 0.35), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(50, 120, 110, 0.30), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #18202c 0%, #11161f 45%, #090b0f 100%);
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    text-align: center; padding: 28px 20px 36px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 70%, transparent 100%);
  }
  header h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: normal; letter-spacing: 0.04em; line-height: 1.15; }
  header p { margin-top: 10px; font-size: clamp(1rem, 2.5vw, 1.3rem); letter-spacing: 0.12em; opacity: 0.92; }
  #avatar {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 2;
    width: clamp(150px, 24vw, 240px); height: clamp(150px, 24vw, 240px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #35455c, #1c2532 70%);
    border: 2px solid rgba(238, 242, 245, 0.35);
    box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
<h1>Clean SEMO</h1>
<p>573-271-4419</p>
</header>
<div id="avatar" data-greeting="Hi, welcome to Clean SEMO — how can we help you today?"></div>
<script>
const GREETING = "Hi, welcome to Clean SEMO — how can we help you today?";
</script>
</body>
</html>
