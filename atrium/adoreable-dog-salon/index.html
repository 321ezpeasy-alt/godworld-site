<title>Adoreable Dog Salon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0e1214; }
  body { font-family: Georgia, "Times New Roman", serif; color: #eef3f1; }
  #backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0e1214; }
  #backdrop img {
    position: absolute; left: 0; top: 0; width: 112%; height: 112%; max-width: none;
    object-fit: cover; object-position: 35% 50%;
    filter: hue-rotate(14deg) saturate(1.0);
    animation: panB 46s ease-in-out infinite alternate;
  }
  @keyframes panA { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.13) translate(-2.2%, -1.4%); } }
  @keyframes panB { from { transform: scale(1.13) translate(-2.2%, -1.4%); } to { transform: scale(1.02) translate(0, 0); } }
  #tint { position: fixed; inset: 0; z-index: 1; background: rgba(64, 145, 150, 0.13); pointer-events: none; }
  #shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(7,10,11,0.42) 0%, rgba(7,10,11,0) 26%, rgba(7,10,11,0) 62%, rgba(7,10,11,0.45) 100%); }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    text-align: center; padding: 28px 20px 36px;
    background: linear-gradient(to bottom, rgba(7,10,11,0.88) 0%, rgba(7,10,11,0.55) 65%, rgba(7,10,11,0) 100%);
  }
  header h1 { font-size: clamp(1.7rem, 4.5vw, 3rem); font-weight: 400; letter-spacing: 0.04em; line-height: 1.15; text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
  header .contact { margin-top: 10px; font-size: clamp(1rem, 2.2vw, 1.3rem); letter-spacing: 0.12em; opacity: 0.95; text-shadow: 0 1px 10px rgba(0,0,0,0.6); }
  #avatar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 2;
    height: min(64vh, 640px); aspect-ratio: 900 / 1193;
    border-radius: 46% 46% 0 0 / 30% 30% 0 0;
    overflow: hidden;
    border: 1px solid rgba(238,243,241,0.35); border-bottom: none;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 0 40px rgba(255,255,255,0.05);
    background: rgba(10, 14, 16, 0.35);
  }
  #avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  #nametag {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3;
    font-family: Helvetica, Arial, sans-serif; font-size: 0.82rem; letter-spacing: 0.14em;
    color: #eef3f1; background: rgba(7,10,11,0.72); border: 1px solid rgba(238,243,241,0.35);
    padding: 6px 14px; border-radius: 999px; white-space: nowrap;
  }
  #sitelink {
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 3;
    font-family: Helvetica, Arial, sans-serif; font-size: 0.95rem; letter-spacing: 0.06em;
    color: #eef3f1; background: rgba(7,10,11,0.78); border: 1px solid rgba(238,243,241,0.5);
    padding: 10px 20px; border-radius: 999px; white-space: nowrap; text-decoration: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  }
  #sitelink:hover { background: rgba(30,40,44,0.9); }
</style>
