<div id="tag-henry" class="nametag">theTruth AI</div>
<div id="tag-emily" class="nametag">Emily</div>

<div id="chat">
  <div id="transcript"></div>
  <div id="chatrow">
    <input id="q" type="text" placeholder="Ask the hosts about the TriPhone&hellip;" autocomplete="off">
    <button id="mic" type="button" title="Ask out loud">&#127908;</button>
    <button id="ask" type="button">Ask</button>
  </div>
</div>

<div id="sellernote">Have a seller code? Put it in the shipping information at checkout &mdash; a verified purchase earns the seller a $100 rebate.</div>
<a id="buybtn" class="pill" href="https://buy.stripe.com/aFa14maEs7sa2lF6ysdUY07">Get the Archangel 8 TriPhone &mdash; $750</a>
<a id="callbtn" class="pill" href="tel:+15735879842">Call the Store</a>

<script>
  // Archangel 8 TriPhone store — two-host, podcast-style brain.
  // Page-scoped (Henry's order, 2026-11-22): the store's conversation is
  // split between two hosts, NotebookLM-style — one host poses the
  // visitor's question, the other answers it, and they alternate every
  // question. Every factual answer comes from the same verified brain
  // the Lobby uses (POST /api/chat — Workers AI draft + truth check);
  // the hosts only ever speak what the brain returns, plus the short
  // scripted hand-offs and greeting below, which carry no facts beyond
  // the store's own ground truth ($750, Stripe checkout, three AI minds,
  // $100 seller rebate). If the brain can't answer, the answering host
  // uses the same graceful fallback line as the front door.
  const BRAIN_CHAT_URL = '/api/chat';
  const FALLBACK_LINE = "Got it. I've logged that for you and kept the line open.";
  const sessionId = 'triphone-' + Array.from(crypto.getRandomValues(new Uint8Array(12)))
    .map(b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');

  const HOSTS = {
    henry: {
      key: 'henry', name: 'theTruth AI', el: document.getElementById('host-henry'),
      pitch: 0.85, rate: 1.0, voiceHint: /male|david|daniel|guy|christopher/i
    },
    emily: {
      key: 'emily', name: 'Emily', el: document.getElementById('host-emily'),
      pitch: 1.35, rate: 1.0, voiceHint: /female|zira|aria|jenny|samantha|zira/i
    }
  };
  // Alternation: Emily answers the first question, Henry the second,
  // and so on — the other host poses each question.
  let turn = 0;
  const answerOrder = ['emily', 'henry'];

  const transcriptEl = document.getElementById('transcript');
  const qEl = document.getElementById('q');
  const askBtn = document.getElementById('ask');

  function addLine(hostKey, text) {
    const div = document.createElement('div');
    div.className = 'line ' + hostKey;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = hostKey === 'visitor' ? 'You' : HOSTS[hostKey].name;
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function pickVoice(host) {
    try {
      const voices = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
      return voices.find(v => host.voiceHint.test(v.name)) || voices[0] || null;
    } catch (_) { return null; }
  }

  function speak(host, text) {
    HOSTS.henry.el.classList.toggle('speaking', host.key === 'henry');
    HOSTS.emily.el.classList.toggle('speaking', host.key === 'emily');
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(host);
      if (v) u.voice = v;
      u.pitch = host.pitch; u.rate = host.rate;
      u.onend = u.onerror = () => host.el.classList.remove('speaking');
      speechSynthesis.speak(u);
    } catch (_) { host.el.classList.remove('speaking'); }
  }

  function hostSay(hostKey, text) {
    addLine(hostKey, text);
    speak(HOSTS[hostKey], text);
  }

  // Scripted two-host greeting — ground-truth facts only.
  let greeted = false;
  function greet() {
    if (greeted) return; greeted = true;
    hostSay('henry', "Welcome to the Archangel 8 TriPhone store. I'm theTruth AI, the digital twin of Henry Kennemore, founder of godworld.org.");
    setTimeout(() => hostSay('emily', "And I'm Emily. The TriPhone runs three AI minds side by side — and it's $750, through Stripe. Ask us anything, and we'll take turns answering."), 600);
  }

  async function askBrain(question) {
    const res = await fetch(BRAIN_CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question, sessionId, page: '/triphone/' })
    });
    if (!res.ok || !res.body) throw new Error('brain http ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    const sentences = [];
    let buffer = '';
    const handleLine = (line) => {
      line = line.trim();
      if (!line) return;
      try {
        const evt = JSON.parse(line);
        if (evt.type === 'sentence' && evt.text) sentences.push(evt.text);
      } catch (_) {}
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf('\n')) >= 0) {
        handleLine(buffer.slice(0, nl));
        buffer = buffer.slice(nl + 1);
      }
    }
    handleLine(buffer);
    if (!sentences.length) throw new Error('empty brain reply');
    return sentences.join(' ');
  }

  async function ask() {
    const question = qEl.value.trim();
    if (!question) return;
    qEl.value = '';
    askBtn.disabled = true;
    greet();
    addLine('visitor', question);
    const answerKey = answerOrder[turn % 2];
    const askerKey = answerKey === 'emily' ? 'henry' : 'emily';
    turn++;
    // Podcast hand-off: the asking host poses the visitor's question
    // (the visitor's own words — no facts added), the other host answers.
    const handoff = askerKey === 'henry'
      ? 'Emily — a visitor wants to know: ' + question
      : 'Henry — here\'s one for you: ' + question;
    hostSay(askerKey, handoff);
    try {
      const answer = await askBrain(question);
      hostSay(answerKey, answer);
    } catch (err) {
      hostSay(answerKey, FALLBACK_LINE);
    }
    askBtn.disabled = false;
    qEl.focus();
  }

  askBtn.addEventListener('click', ask);
  qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
  qEl.addEventListener('focus', greet, { once: true });
  document.getElementById('host-henry').addEventListener('click', greet);
  document.getElementById('host-emily').addEventListener('click', greet);

  // Optional voice input, same Web Speech pattern as the front door.
  const micBtn = document.getElementById('mic');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { micBtn.style.display = 'none'; }
  else {
    micBtn.addEventListener('click', () => {
      const rec = new SpeechRec();
      rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = false;
      rec.onresult = (event) => {
        const t = event.results[0][0].transcript.trim();
        if (t) { qEl.value = t; ask(); }
      };
      try { rec.start(); } catch (_) {}
    });
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
