<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================================
   GODWORLD.ORG — 3D WORLD PREVIEW (2026-11-23)
   A real Three.js street you stand in: Broadway, Cape Girardeau, with the
   businesses as 3D places at their real relative geography, a rigged avatar
   standing in the world with you, voice-only movement (ZERO BUTTONS), and
   open questions answered by the verified brain at godworld.org/api/chat.

   COORDINATES: lat/lng below are the approximations carried over from the
   earlier prototypes (ChatGPT rebuild) — UNVERIFIED. They place the
   businesses in roughly their real relative positions along Broadway /
   Main St; do NOT treat them as surveyed precision.
   AVATAR: stock Avaturn rig (avaturn-lite.glb) — NOT Henry's likeness.
   VOICE: device speechSynthesis for this step. Because speechSynthesis
   output cannot be routed into a Web Audio analyser in any browser, the
   Wawa Lipsync audio-analysis pattern from the Lobby v3 build cannot be
   driven by this voice; the avatar uses idle motion + a speaking bounce
   instead. That is stated plainly, not faked.
   ============================================================================ */

const MODEL_URL = 'https://gw-assets-dd3.pages.dev/avaturn-lite.glb';
const BRAIN_CHAT_URL = 'https://godworld.org/api/chat';

// --- PLACES (single source of truth; coords are approximations, see header) ---
const ANCHOR = { lat: 37.3066, lng: -89.5183 }; // Broadway anchor / spawn
const DOMAINS = [
    { id: 'flagship', kind: 'network', name: 'Godworld.org Flagship', domain: 'godworld.org',
      lat: 37.3066, lng: -89.5183, color: '#818cf8', avatarPreset: 'brand',
      keywords: ['flagship'],
      guidePitch: "You are standing at the flagship of Godworld.org, right here on Broadway. The ground underneath stays the same — talk to move between places on this world." },
    { id: 'georges', kind: 'business', name: "George's", domain: 'georgesonbroadway.com',
      address: '600 Broadway St, Cape Girardeau, MO 63701',
      lat: 37.3059, lng: -89.5181, color: '#38bdf8', avatarPreset: 'solar',
      keywords: ['george', "george's", 'georges'],
      guidePitch: "You're now standing at George's on Broadway Street — a real place in the world, not a page." },
    { id: 'el-kolibri', kind: 'business', name: 'El Kolibri Coffee & Curiosities', domain: 'elkolibricoffee.com',
      address: '605 Broadway St Ste 203, Cape Girardeau, MO 63701',
      lat: 37.3074, lng: -89.5215, color: '#f43f5e', avatarPreset: 'emerald',
      keywords: ['kolibri', 'el kolibri', 'hummingbird', 'coffee'],
      guidePitch: "Now you're by El Kolibri Coffee and Curiosities on Broadway — another distinct place on the same ground." },
    { id: 'annie-lauries', kind: 'business', name: "Annie Laurie's", domain: 'annielauries.com',
      address: '536 Broadway St, Cape Girardeau, MO 63701',
      lat: 37.3042, lng: -89.5162, color: '#f59e0b', avatarPreset: 'cyber',
      keywords: ['annie', "annie laurie's", 'annie lauries', 'laurie'],
      guidePitch: "This brings you over to Annie Laurie's on Broadway Street — moving through places while the world stays underneath you." },
    { id: 'board-and-brush', kind: 'business', name: 'Board & Brush Creative Studio', domain: 'boardandbrush.com/capegirardeau',
      address: '20 Main St #101, Cape Girardeau, MO 63701',
      lat: 37.3089, lng: -89.5148, color: '#10b981', avatarPreset: 'brand',
      keywords: ['board and brush', 'board & brush', 'board', 'brush'],
      guidePitch: "You've moved to Board and Brush Creative Studio on Main Street — still standing in the same living world." }
];
const MUSE_INFO = "I am here so you can stand in this world and move between places. Ask for gold, cyan, emerald, or our brand, and the light of the world shifts with me — no buttons, just your voice.";

const PRESET_ACCENTS = { brand: '#6366f1', cyber: '#06b6d4', solar: '#f59e0b', emerald: '#10b981' };

// lat/lng -> local meters relative to the Broadway anchor (x east, z south)
const M_PER_DEG_LAT = 111320;
const M_PER_DEG_LNG = 111320 * Math.cos(ANCHOR.lat * Math.PI / 180);
function toLocal(lat, lng) {
    return new THREE.Vector3((lng - ANCHOR.lng) * M_PER_DEG_LNG, 0, (lat - ANCHOR.lat) * M_PER_DEG_LAT);
}
DOMAINS.forEach(d => { d.pos = toLocal(d.lat, d.lng); });

// Where each building stands relative to its street point, and where the
// visitor stands to look at it.
const BUILDING_OFFSET = {
    'flagship':       [0, 0],
    'georges':        [11, -7],
    'el-kolibri':     [-11, -7],
    'annie-lauries':  [11, 7],
    'board-and-brush':[-11, 7]
};
const BUILDING_SIZE = {
    'georges':        [20, 13, 15],
    'el-kolibri':     [15, 9, 12],
    'annie-lauries':  [17, 11, 14],
    'board-and-brush':[19, 15, 13]
};

// --- STATE ---
const state = {
    currentId: 'flagship',
    accent: 'brand',
    isTourActive: false,
    tourTimer: null,
    speaking: false,
    gestureUnlocked: false,
    avatarReady: false,
    shouldListen: false
};

// --- DOM ---
const statusEl = document.getElementById('status-line');
const spokenEl = document.getElementById('spoken-line');
function setStatus(text) { statusEl.textContent = text; }
function setSpoken(text) { spokenEl.textContent = text; }

// --- THREE SETUP ---
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); // perf cap for low-end Android
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050811);
scene.fog = new THREE.Fog(0x050811, 55, 620);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 1500);

// Camera rig: standpoint position + yaw/pitch (drag to look; voice glides)
const rig = {
    pos: new THREE.Vector3(0, 1.7, 26),
    yaw: Math.PI, pitch: -0.02,
    fromPos: null, toPos: null, fromYaw: 0, toYaw: 0, fromPitch: 0, toPitch: 0,
    glideT: 1, glideDur: 2.5
};
function shortestAngle(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d;
}
function glideTo(pos, yaw, pitch, dur = 2.5) {
    rig.fromPos = rig.pos.clone(); rig.toPos = pos.clone();
    rig.fromYaw = rig.yaw; rig.toYaw = shortestAngle(rig.yaw, yaw);
    rig.fromPitch = rig.pitch; rig.toPitch = pitch;
    rig.glideT = 0; rig.glideDur = dur;
}

// Lights (cheap: hemisphere + directional + one accent point light)
const hemi = new THREE.HemisphereLight(0x8fb8ff, 0x1a1030, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xdde7ff, 1.1);
sun.position.set(80, 140, 60);
scene.add(sun);
const accentLight = new THREE.PointLight(0x6366f1, 350, 260, 1.8);
accentLight.position.set(0, 14, 0);
scene.add(accentLight);

// Stars (one Points cloud, cheap)
{
    const n = 350, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
        const r = 900, th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * 0.42;
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph) + 40;
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaFC4ff, size: 2.2, sizeAttenuation: false, fog: false })));
}

// Ground: dark planet surface + subtle grid
{
    const ground = new THREE.Mesh(
        new THREE.CircleGeometry(850, 48),
        new THREE.MeshStandardMaterial({ color: 0x0a0f1e, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05;
    scene.add(ground);
    const grid = new THREE.GridHelper(1400, 140, 0x27356e, 0x141d3d);
    grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = 0;
    scene.add(grid);
}

// Roads: ribbons along the street polylines through the real place points
const streetPath = ['el-kolibri', 'flagship', 'georges', 'annie-lauries'].map(id => DOMAINS.find(d => d.id === id).pos);
const sidePath = [DOMAINS.find(d => d.id === 'flagship').pos, DOMAINS.find(d => d.id === 'board-and-brush').pos];
function ribbon(points, width, color, y) {
    const verts = [], idx = [];
    points.forEach((p, i) => {
        const prev = points[Math.max(0, i - 1)], next = points[Math.min(points.length - 1, i + 1)];
        const dir = new THREE.Vector3().subVectors(next, prev); dir.y = 0; dir.normalize();
        const perp = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(width / 2);
        verts.push(p.x - perp.x, y, p.z - perp.z, p.x + perp.x, y, p.z + perp.z);
        if (i > 0) { const b = i * 2; idx.push(b - 2, b - 1, b, b - 1, b + 1, b); }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
    scene.add(m);
}
ribbon(streetPath, 13, 0x1b2438, 0.02);  // sidewalk bed
ribbon(streetPath, 9, 0x11182b, 0.045);  // road
ribbon(sidePath, 13, 0x1b2438, 0.02);
ribbon(sidePath, 9, 0x11182b, 0.045);

// Canvas-sprite text label
function makeLabel(text, colorHex) {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 224;
    const x = c.getContext('2d');
    x.font = '700 92px system-ui, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(0,0,0,0.95)'; x.shadowBlur = 18;
    x.fillStyle = '#ffffff';
    x.fillText(text, 512, 96);
    x.shadowBlur = 0;
    x.fillStyle = colorHex;
    x.fillRect(312, 168, 400, 10);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    sp.scale.set(17, 3.7, 1);
    return sp;
}

// Buildings + flagship monument + street lamps
const lampHeadGeo = new THREE.SphereGeometry(0.32, 10, 8);
const lampPoleGeo = new THREE.CylinderGeometry(0.09, 0.09, 5.4, 6);
const lampHeadMat = new THREE.MeshStandardMaterial({ color: 0xffe9b0, emissive: 0xffca66, emissiveIntensity: 2.2 });
const lampPoleMat = new THREE.MeshStandardMaterial({ color: 0x2a3350, roughness: 0.8 });
function addLamp(p, sideSign) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(lampPoleGeo, lampPoleMat); pole.position.y = 2.7; g.add(pole);
    const head = new THREE.Mesh(lampHeadGeo, lampHeadMat); head.position.y = 5.5; g.add(head);
    g.position.set(p.x + sideSign * 7.5, 0, p.z);
    scene.add(g);
}
DOMAINS.forEach(d => {
    const [ox, oz] = BUILDING_OFFSET[d.id];
    d.buildingPos = new THREE.Vector3(d.pos.x + ox, 0, d.pos.z + oz);
    if (d.kind === 'business') {
        const [w, h, dep] = BUILDING_SIZE[d.id];
        const accent = new THREE.Color(d.color);
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, dep),
            new THREE.MeshStandardMaterial({ color: 0x131b31, roughness: 0.85, emissive: accent, emissiveIntensity: 0.06 })
        );
        body.position.set(d.buildingPos.x, h / 2, d.buildingPos.z);
        scene.add(body);
        // glowing storefront face toward the street point
        const face = new THREE.Mesh(
            new THREE.PlaneGeometry(w * 0.86, h * 0.52),
            new THREE.MeshStandardMaterial({ color: 0x0b1120, emissive: accent, emissiveIntensity: 0.85, roughness: 0.4 })
        );
        const dir = new THREE.Vector3().subVectors(d.pos, d.buildingPos); dir.y = 0; dir.normalize();
        face.position.set(d.buildingPos.x + dir.x * (dep / 2 + 0.06), h * 0.38, d.buildingPos.z + dir.z * (dep / 2 + 0.06));
        face.lookAt(face.position.clone().add(dir));
        scene.add(face);
        // roof accent edge
        const roof = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.5, 0.35, dep + 0.5),
            new THREE.MeshStandardMaterial({ color: 0x0b1120, emissive: accent, emissiveIntensity: 1.4 })
        );
        roof.position.set(d.buildingPos.x, h + 0.18, d.buildingPos.z);
        scene.add(roof);
        const label = makeLabel(d.name.toUpperCase(), d.color);
        label.position.set(d.buildingPos.x, h + 3.4, d.buildingPos.z);
        scene.add(label);
        addLamp(d.pos, ox >= 0 ? -1 : 1);
    } else {
        // Flagship: glowing ring monument + label — world home
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(6, 0.28, 10, 48),
            new THREE.MeshStandardMaterial({ color: 0x0b1120, emissive: new THREE.Color(d.color), emissiveIntensity: 1.6 })
        );
        ring.position.set(d.buildingPos.x, 5.2, d.buildingPos.z);
        ring.name = 'flagship-ring';
        scene.add(ring);
        const label = makeLabel('GODWORLD.ORG', d.color);
        label.position.set(d.buildingPos.x, 10.4, d.buildingPos.z);
        scene.add(label);
        addLamp(d.pos, 1); addLamp(d.pos, -1);
    }
    // standpoint: on the street point, looking at the building/monument
    const look = new THREE.Vector3(d.buildingPos.x, 3.2, d.buildingPos.z);
    const eye = new THREE.Vector3(d.pos.x, 1.7, d.pos.z);
    const dirv = new THREE.Vector3().subVectors(look, eye);
    d.stand = { eye, yaw: Math.atan2(-dirv.x, -dirv.z), pitch: Math.atan2(dirv.y - 1.7, Math.hypot(dirv.x, dirv.z)) * 0.4 };
});
// Flagship spawn: step back so the avatar + ring are in view
{
    const f = DOMAINS[0];
    f.stand.eye = new THREE.Vector3(f.pos.x - 3, 1.7, f.pos.z + 15);
    const dirv = new THREE.Vector3().subVectors(new THREE.Vector3(f.buildingPos.x, 3.4, f.buildingPos.z), f.stand.eye);
    f.stand.yaw = Math.atan2(-dirv.x, -dirv.z);
    f.stand.pitch = -0.01;
    rig.pos.copy(f.stand.eye); rig.yaw = f.stand.yaw; rig.pitch = f.stand.pitch;
}

// Ambient life: walkers on the sidewalks + two slow lit cars on the road
const walkerBodyGeo = new THREE.CylinderGeometry(0.17, 0.21, 0.78, 8);
const walkerHeadGeo = new THREE.SphereGeometry(0.15, 8, 8);
const walkerMats = [0x38bdf8, 0xf43f5e, 0xf59e0b, 0x10b981, 0xa78bfa, 0xf8fafc].map(c =>
    new THREE.MeshStandardMaterial({ color: 0x1a2338, emissive: c, emissiveIntensity: 0.55, roughness: 0.7 }));
const walkers = [];
function pathPoint(points, dist) {
    // walk a polyline by arc length; returns {pos, dir}
    let acc = 0;
    for (let i = 0; i < points.length - 1; i++) {
        const a = points[i], b = points[i + 1];
        const len = a.distanceTo(b);
        if (dist <= acc + len) {
            const t = len ? (dist - acc) / len : 0;
            return { pos: new THREE.Vector3().lerpVectors(a, b, t), dir: new THREE.Vector3().subVectors(b, a).normalize() };
        }
        acc += len;
    }
    const last = points[points.length - 1], prev = points[points.length - 2];
    return { pos: last.clone(), dir: new THREE.Vector3().subVectors(last, prev).normalize() };
}
const streetLen = (() => { let L = 0; for (let i = 0; i < streetPath.length - 1; i++) L += streetPath[i].distanceTo(streetPath[i + 1]); return L; })();
for (let i = 0; i < 6; i++) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(walkerBodyGeo, walkerMats[i]); body.position.y = 0.72; g.add(body);
    const head = new THREE.Mesh(walkerHeadGeo, walkerMats[i]); head.position.y = 1.32; g.add(head);
    scene.add(g);
    walkers.push({ g, s: (streetLen / 6) * i, speed: 1.1 + (i % 3) * 0.35, dirSign: i % 2 ? 1 : -1, side: i % 2 ? 5.6 : -5.6, phase: i * 1.7 });
}
const cars = [];
{
    const carBodyGeo = new THREE.BoxGeometry(1.9, 0.62, 4.3);
    const carTopGeo = new THREE.BoxGeometry(1.7, 0.5, 2.2);
    const lightGeo = new THREE.BoxGeometry(0.32, 0.16, 0.08);
    const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff2c0, emissive: 0xffe9a0, emissiveIntensity: 3 });
    [0xf43f5e, 0x38bdf8].forEach((c, i) => {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0.4 });
        const body = new THREE.Mesh(carBodyGeo, mat); body.position.y = 0.55; g.add(body);
        const top = new THREE.Mesh(carTopGeo, mat); top.position.set(0, 1.05, -0.2); g.add(top);
        const l1 = new THREE.Mesh(lightGeo, lightMat); l1.position.set(-0.6, 0.55, 2.16); g.add(l1);
        const l2 = new THREE.Mesh(lightGeo, lightMat); l2.position.set(0.6, 0.55, 2.16); g.add(l2);
        scene.add(g);
        cars.push({ g, s: i * streetLen * 0.45, speed: 6.5 + i * 1.5, dirSign: i ? -1 : 1, lane: i ? -2.4 : 2.4 });
    });
}

// --- AVATAR (stock Avaturn rig — NOT Henry's likeness) ---
let avatar = null, avatarBaseY = 0;
const morphMeshes = [];
{
    const f = DOMAINS[0];
    const avatarPos = new THREE.Vector3(f.pos.x + 3.4, 0, f.pos.z + 6.5);
    const loader = new GLTFLoader();
    loader.load(MODEL_URL,
        (gltf) => {
            avatar = gltf.scene;
            const box = new THREE.Box3().setFromObject(avatar);
            const size = new THREE.Vector3(); box.getSize(size);
            const scale = 1.8 / Math.max(size.y, 0.001);
            avatar.scale.setScalar(scale);
            const box2 = new THREE.Box3().setFromObject(avatar);
            avatar.position.set(avatarPos.x, -box2.min.y, avatarPos.z);
            avatarBaseY = avatar.position.y;
            avatar.traverse(o => {
                if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o);
            });
            scene.add(avatar);
            state.avatarReady = true;
            setStatus('GODWORLD.ORG • 3D WORLD • GUIDE WITH YOU');
        },
        undefined,
        () => {
            // World still renders without the rig — honest status, never empty.
            setStatus('GODWORLD.ORG • 3D WORLD • GUIDE COULD NOT LOAD — WORLD STILL OPEN');
            setSpoken('The world is open, but the guide figure could not load on this connection. You can still talk — say a place, or ask me anything.');
        });
}

// --- SPEECH (device voice for this step) ---
let recognition = null;
function speakText(text) {
    if (!('speechSynthesis' in window) || !text) return;
    try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.02;
        u.onstart = () => { state.speaking = true; pauseListening(); };
        u.onend = () => { state.speaking = false; resumeListening(); };
        u.onerror = () => { state.speaking = false; resumeListening(); };
        window.speechSynthesis.speak(u);
    } catch (e) { state.speaking = false; }
}

// --- MOVEMENT ---
function goToPlace(id, announce = true) {
    const d = DOMAINS.find(x => x.id === id) || DOMAINS[0];
    state.currentId = d.id;
    applyAccent(d.avatarPreset, false);
    glideTo(d.stand.eye, d.stand.yaw, d.stand.pitch, 2.5);
    setStatus(`GODWORLD.ORG • ${d.name.toUpperCase()} • ${d.domain.toUpperCase()}`);
    if (announce) { setSpoken(d.guidePitch); speakText(d.guidePitch); }
}
function stopAutoTour() {
    if (!state.isTourActive) return;
    state.isTourActive = false;
    if (state.tourTimer) { clearTimeout(state.tourTimer); state.tourTimer = null; }
}
function startAutoTour() {
    stopAutoTour();
    state.isTourActive = true;
    const order = ['flagship', 'georges', 'el-kolibri', 'annie-lauries', 'board-and-brush'];
    let i = 0;
    setSpoken('I will show you around this world right now.');
    speakText('I will show you around this world right now.');
    const step = () => {
        if (!state.isTourActive) return;
        goToPlace(order[i % order.length]);
        i++;
        state.tourTimer = setTimeout(step, 9000);
    };
    state.tourTimer = setTimeout(step, 1200);
}
function applyAccent(preset, announce = true) {
    const hex = PRESET_ACCENTS[preset];
    if (!hex) return;
    state.accent = preset;
    accentLight.color.set(hex);
    const ring = scene.getObjectByName('flagship-ring');
    if (ring) ring.material.emissive.set(hex);
    if (announce) {
        const line = `The light of the world shifts to ${preset}.`;
        setSpoken(line); speakText(line);
    }
}

// --- BRAIN (transplanted from the wired tour-guide router) ---
// Open-ended questions go to the live double-verified brain: a Workers AI
// draft checked by an independent verify pass, verdicts logged to the D1
// truth log. NDJSON stream: a {"type":"meta",...} line, then
// {"type":"sentence",...} lines. Status reflects the REAL round trip.
// Failure is fail-closed: one honest line shown, NOTHING spoken.
let brainSessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
function brainFail() {
    setStatus("GODWORLD.ORG • BRAIN DIDN'T ANSWER");
    setSpoken("The verified brain didn't answer just now — give it a moment and ask me again.");
}
async function askVerifiedBrain(question) {
    stopAutoTour();
    setStatus('GODWORLD.ORG • ASKING VERIFIED BRAIN…');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const sentences = [];
    try {
        const res = await fetch(BRAIN_CHAT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: question, sessionId: brainSessionId }),
            signal: controller.signal
        });
        if (!res.ok || !res.body) throw new Error('brain http ' + res.status);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const handleLine = (line) => {
            const t = line.trim();
            if (!t) return;
            let obj;
            try { obj = JSON.parse(t); } catch (e) { return; }
            if (obj.type === 'meta' && obj.sessionId) {
                brainSessionId = obj.sessionId;
            } else if (obj.type === 'sentence' && obj.text) {
                if (sentences.length === 0) setStatus('GODWORLD.ORG • ANSWER VERIFIED ✓');
                sentences.push(obj.text);
                setSpoken(sentences.join(' '));
            }
        };
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf('\n')) >= 0) {
                handleLine(buffer.slice(0, idx));
                buffer = buffer.slice(idx + 1);
            }
        }
        if (buffer.trim()) handleLine(buffer);
    } catch (err) {
        clearTimeout(timer);
        brainFail();
        return;
    }
    clearTimeout(timer);
    if (sentences.length === 0) { brainFail(); return; }
    setStatus('GODWORLD.ORG • 3D WORLD • GUIDE WITH YOU');
    speakText(sentences.join(' '));
}

// --- INTENT ROUTING: local intents execute here; everything else is a
// --- question for the verified brain. Bare "godworld" is NOT a local trigger.
function handleUserIntent(rawText) {
    const text = String(rawText || '').trim();
    if (!text) return;
    const lower = text.toLowerCase();

    if (lower.includes('show us around') || lower.includes("don't know") || lower.includes('show me around') || lower.includes('tour')) {
        if (!state.isTourActive) startAutoTour();
        return;
    }
    if (lower.includes('stop') || lower.includes('stay here')) {
        stopAutoTour();
        const line = 'Okay, we will stay right here. What would you like to talk about?';
        setSpoken(line); speakText(line);
        return;
    }
    stopAutoTour();

    // Place names — voice moves the camera there
    for (const d of DOMAINS) {
        if (d.keywords.some(k => lower.includes(k)) || lower.includes(d.name.toLowerCase())) {
            goToPlace(d.id);
            return;
        }
    }
    // Muse color words shift the world's accent light
    if (lower.includes('gold') || lower.includes('solar') || lower.includes('warm')) { applyAccent('solar'); return; }
    if (lower.includes('cyan') || lower.includes('cyber') || lower.includes('sleek')) { applyAccent('cyber'); return; }
    if (lower.includes('emerald') || lower.includes('green')) { applyAccent('emerald'); return; }
    if (lower.includes('our brand') || lower.includes('push brand') || lower.includes('reset')) { applyAccent('brand'); return; }
    if (lower.includes('muse') || lower.includes('crash course')) { setSpoken(MUSE_INFO); speakText(MUSE_INFO); return; }
    if (lower.includes('home') || lower.includes('flagship')) { goToPlace('flagship'); return; }
    if (lower.includes('district') || lower.includes('business') || lower.includes('map')) { goToPlace('georges'); return; }

    askVerifiedBrain(text);
}

// --- VOICE RECOGNITION (starts after the first tap — browser gesture rule) ---
function pauseListening() {
    if (recognition && state.shouldListen) { try { recognition.stop(); } catch (e) {} }
}
function resumeListening() {
    if (recognition && state.shouldListen) { try { recognition.start(); } catch (e) {} }
}
function initVoiceRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        setStatus('GODWORLD.ORG • 3D WORLD • VOICE UNAVAILABLE IN THIS BROWSER');
        return;
    }
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        if (last && last[0]) handleUserIntent(last[0].transcript);
    };
    recognition.onerror = () => {};
    recognition.onend = () => {
        if (state.shouldListen && !state.speaking) {
            setTimeout(() => { try { recognition.start(); } catch (e) {} }, 350);
        }
    };
    state.shouldListen = true;
    try { recognition.start(); } catch (e) {}
}

// --- INPUT: tap = gesture unlock only; drag = look around ---
let dragging = false, lastX = 0, lastY = 0;
window.addEventListener('pointerdown', (e) => {
    if (!state.gestureUnlocked) {
        state.gestureUnlocked = true;
        // Prime speech synthesis inside the gesture so later lines can speak
        if ('speechSynthesis' in window) {
            try { const u = new SpeechSynthesisUtterance(''); window.speechSynthesis.speak(u); } catch (err) {}
        }
        initVoiceRecognition();
        setStatus('GODWORLD.ORG • 3D WORLD • VOICE READY — JUST TALK');
    }
    dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (rig.glideT < 1) return; // let the glide finish before drag-look takes over
    rig.yaw -= dx * 0.005;
    rig.pitch = THREE.MathUtils.clamp(rig.pitch - dy * 0.004, -0.9, 0.9);
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();
let nextBlink = performance.now() + 2000, blinkUntil = 0;
const camDir = new THREE.Vector3();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const now = performance.now();

    // Camera glide (smooth ease between standpoints)
    if (rig.glideT < 1) {
        rig.glideT = Math.min(1, rig.glideT + dt / rig.glideDur);
        const e = rig.glideT < 0.5 ? 4 * rig.glideT ** 3 : 1 - Math.pow(-2 * rig.glideT + 2, 3) / 2;
        rig.pos.lerpVectors(rig.fromPos, rig.toPos, e);
        rig.yaw = rig.fromYaw + (rig.toYaw - rig.fromYaw) * e;
        rig.pitch = rig.fromPitch + (rig.toPitch - rig.fromPitch) * e;
    }
    camera.position.copy(rig.pos);
    camera.position.y += Math.sin(t * 1.6) * 0.03; // gentle standing sway
    camDir.set(-Math.sin(rig.yaw) * Math.cos(rig.pitch), Math.sin(rig.pitch), -Math.cos(rig.yaw) * Math.cos(rig.pitch));
    camera.lookAt(camera.position.clone().add(camDir));

    // Avatar idle life: breathing bob, slight sway, blinks (ARKit morphs when
    // the rig carries them), speaking bounce while the voice is active.
    if (avatar) {
        const bounce = state.speaking ? Math.abs(Math.sin(t * 11)) * 0.035 : 0;
        avatar.position.y = avatarBaseY + Math.sin(t * 1.35) * 0.012 + bounce;
        avatar.rotation.z = Math.sin(t * 0.7) * 0.008;
        // Face the visitor
        const targetYaw = Math.atan2(camera.position.x - avatar.position.x, camera.position.z - avatar.position.z);
        avatar.rotation.y += (shortestAngle(avatar.rotation.y, targetYaw) - avatar.rotation.y) * Math.min(1, dt * 3);
        if (now >= nextBlink) { blinkUntil = now + 130; nextBlink = now + 2200 + Math.random() * 2600; }
        const blink = now < blinkUntil ? 1 : 0;
        for (const mesh of morphMeshes) {
            const dict = mesh.morphTargetDictionary, infl = mesh.morphTargetInfluences;
            if (!dict || !infl) continue;
            for (const name of ['eyeBlinkLeft', 'eyeBlinkRight']) {
                const idx = dict[name];
                if (idx !== undefined) infl[idx] += (blink - infl[idx]) * Math.min(1, dt * 22);
            }
        }
    }

    // Walkers stroll the sidewalks; cars roll the road
    for (const w of walkers) {
        w.s += w.speed * w.dirSign * dt;
        if (w.s > streetLen - 2) { w.s = streetLen - 2; w.dirSign = -1; }
        if (w.s < 2) { w.s = 2; w.dirSign = 1; }
        const { pos, dir } = pathPoint(streetPath, w.s);
        const perp = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(w.side);
        w.g.position.set(pos.x + perp.x, Math.abs(Math.sin(t * 6 + w.phase)) * 0.045, pos.z + perp.z);
        w.g.rotation.y = Math.atan2(dir.x * w.dirSign, dir.z * w.dirSign);
    }
    for (const c of cars) {
        c.s += c.speed * c.dirSign * dt;
        if (c.s > streetLen - 4) c.s = 4;
        if (c.s < 4) c.s = streetLen - 4;
        const { pos, dir } = pathPoint(streetPath, c.s);
        const perp = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(c.lane);
        c.g.position.set(pos.x + perp.x, 0.05, pos.z + perp.z);
        c.g.rotation.y = Math.atan2(dir.x * c.dirSign, dir.z * c.dirSign) - (c.dirSign < 0 ? 0 : 0);
    }

    const ring = scene.getObjectByName('flagship-ring');
    if (ring) { ring.rotation.z = t * 0.25; ring.position.y = 5.2 + Math.sin(t * 0.9) * 0.25; }

    renderer.render(scene, camera);
}
setStatus('GODWORLD.ORG • 3D WORLD • TAP ANYWHERE, THEN TALK');
animate();
</script>
