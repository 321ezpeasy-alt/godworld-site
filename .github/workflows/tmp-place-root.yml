name: Place root index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary upload to root index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.com"
          git mv -f index-upload-tmp.html index.html
          git commit -m "Place new root index"
          git push
