name: Temp replace root index
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp-replace-root-index.yml
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move godworld-org-lobby.html onto index.html
        run: |
          git config user.name "321ezpeasy-alt"
          git config user.email "321ezpeasy-alt@users.noreply.github.com"
          if [ -f godworld-org-lobby.html ]; then
            git mv -f godworld-org-lobby.html index.html
            git commit -m "Replace root index.html with new godworld.org lobby page"
            git push
          else
            echo "godworld-org-lobby.html not found; nothing to do"
          fi
