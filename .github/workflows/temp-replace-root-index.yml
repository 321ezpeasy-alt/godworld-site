name: Temp replace root index
on:
  push:
    paths:
      - .github/workflows/temp-replace-root-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move lobby file onto index.html
        run: |
          git config user.name "321ezpeasy-alt"
          git config user.email "321ezpeasy-alt@users.noreply.github.com"
          git mv -f godworld-org-lobby.html index.html
          git commit -m "Replace root index.html with final corrected godworld.org lobby build"
          git push
