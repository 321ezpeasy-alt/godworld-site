name: Temp replace root index

on:
  push:
    paths:
      - .github/workflows/temp-replace-root-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace root index.html with lobby build
        run: |
          if [ ! -f godworld-org-lobby.html ]; then
            echo "godworld-org-lobby.html not present; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f godworld-org-lobby.html index.html
          git commit -m "Replace root index.html with godworld-org-lobby.html lobby build"
          git push
