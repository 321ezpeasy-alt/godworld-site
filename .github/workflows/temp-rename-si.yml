name: Temporary rename si-designs file

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename s-i-designs.html to index.html
        run: |
          if [ ! -f si-designs/s-i-designs.html ]; then
            echo "si-designs/s-i-designs.html already gone; nothing to do."
            exit 0
          fi
          git mv -f si-designs/s-i-designs.html si-designs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename si-designs/s-i-designs.html to si-designs/index.html"
          git push
