name: Rename S.I. Designs file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new build
        run: |
          set -e
          ls -l si-designs/
          test -f si-designs/s-i-designs.html
          test -f si-designs/index.html
          git config user.name "321ezpeasy-alt"
          git config user.email "321ezpeasy-alt@users.noreply.github.com"
          git mv -f si-designs/s-i-designs.html si-designs/index.html
          git status --short
          ls -lh si-designs/
          git commit -m "Replace si-designs/index.html with new S.I. Designs build"
          git push
