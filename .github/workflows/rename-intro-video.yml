name: Rename intro video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename video to godworld-intro.mp4
        run: |
          git rm si-designs/godworld-intro.mp4
          git mv si-designs/d5d5345c2cfc859855f33adcf4f084b3a4a310f02d3dcd39ac6682cf74f92811.mp4 si-designs/godworld-intro.mp4
          git config user.name "321ezpeasy-alt"
          git config user.email "321ezpeasy@gmail.com"
          git commit -m "Rename d5d5345c2cfc859855f33adcf4f084b3a4a310f02d3dcd39ac6682cf74f92811.mp4 to godworld-intro.mp4"
          git push
