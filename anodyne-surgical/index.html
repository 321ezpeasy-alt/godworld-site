<div class="gift-line">A free storefront by Super Intelligent Designs · godworld.org</div>

<script>
'use strict';
/*
  S.I. Designs gift storefront for Anodyne Surgical — LIVE build.
  Same pattern as the other ON builds: no chat transcript, no text field,
  no form, nothing to buy, and no phone number — wordless past the header,
  the avatar's name tag, the decorative watermark, and the gift line.
  One tap anywhere enters the store: the avatar greets the visitor out
  loud with the locked greeting and a short spiel of verified public
  facts, then listens — visitor speech is relayed to the shared live
  brain through the Cloudflare door (POST godworld.org/api/chat, the
  only door; no keys ever appear in a page) and the verified answers
  are spoken sentence by sentence. Talking over it (speech or another
  tap) stops it instantly (barge-in). This store is a free gift and is
  treated as turned on (Henry's direction, 2026-11-22).
*/

const CHAT_URL = 'https://godworld.org/api/chat';
const GREETING = "Welcome to Anodyne Surgical, I am theTruth AI. How may I help you today?";
const BRAIN_DOWN_LINE = "Sorry — my connection isn't reachable just this second. Give me a moment and ask me again.";
const SPIEL = [
  "Anodyne Surgical is based right here in O'Fallon, Missouri, at 804 Corporate Centre Drive.",
  "The company — PSI/EYE-KO, Incorporated, doing business as Anodyne Surgical — was founded in 1981 and is still privately owned, continuously owned by its founder for over thirty-five years.",
  "It makes disposable ophthalmic cannulas and precision instruments for eye surgery — one of the nation's largest manufacturers of disposable ophthalmic surgical instruments, built for cataract surgery and the operating room.",
  "Our contact at the company is Craig Lee. Until the owners pick their own avatar, I will be the one greeting you at this door.",
  "This free storefront was built by Super Intelligent Designs — ask me anything about the company, and welcome in."
];

let entered = false;
let speaking = false;
let sessionId = null;
let streamController = null;
let recognition = null;
const avatarEl = document.getElementById('avatar');
const speechQueue = [];
let speechDraining = false;

// --- Speaking (browser speech synthesis, as in the other ON builds) --------
function speak(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(); return; }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function drainSpeechQueue() {
  if (speechDraining) return;
  speechDraining = true;
  speaking = true;
  avatarEl.classList.add('speaking');
  while (speechQueue.length > 0) {
    const item = speechQueue.shift();
    await speak(item.text);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
  speechDraining = false;
}

function stopSpeaking() {
  speechQueue.length = 0;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  speaking = false;
  avatarEl.classList.remove('speaking');
}

function queueSpeech(text) {
  speechQueue.push({ text });
  drainSpeechQueue();
}

// --- Conversation with the live brain (Worker /api/chat, streamed) ---------
async function sendChat(message) {
  stopSpeaking();
  streamController = new AbortController();
  let answered = '';
  try {
    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId }),
      signal: streamController.signal,
    });
    if (!res.ok || !res.body) throw new Error('chat request failed: ' + res.status);
    const headerSession = res.headers.get('X-Session-Id');
    if (headerSession) sessionId = headerSession;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let event;
        try { event = JSON.parse(line); } catch { continue; }
        if (event.type === 'meta' && event.sessionId) sessionId = event.sessionId;
        if (event.type === 'sentence' && event.text) {
          answered += (answered ? ' ' : '') + event.text;
          speechQueue.push({ text: event.text });
          drainSpeechQueue();
        }
      }
    }
    if (!answered) queueSpeech(BRAIN_DOWN_LINE);
  } catch (err) {
    if (err.name === 'AbortError') return; // barged in — silence is correct
    queueSpeech(BRAIN_DOWN_LINE);
  } finally {
    streamController = null;
  }
}

// --- Listening (continuous, hands-free after entry, as in the ON builds) ---
function startListening() {
  const RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!RecognitionCtor) return; // voice input unsupported — the tap-to-hear spiel still works
  recognition = new RecognitionCtor();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const result = event.results[event.results.length - 1];
    if (!result || !result.isFinal) return;
    const transcript = result[0].transcript.trim();
    if (!transcript) return;
    if (speaking || streamController) {
      if (streamController) streamController.abort();
      stopSpeaking();
    }
    sendChat(transcript);
  };
  recognition.onend = () => {
    if (entered) { try { recognition.start(); } catch { /* already running */ } }
  };
  recognition.onerror = () => { /* onend restart handles recovery */ };
  try { recognition.start(); } catch { /* already running */ }
}

// --- Entry: one tap anywhere ------------------------------------------------
async function enter() {
  entered = true;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try { await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { /* visitor declined */ }
  }
  queueSpeech(GREETING);
  for (const line of SPIEL) queueSpeech(line);
  startListening();
}

document.body.addEventListener('click', () => {
  if (!entered) { enter(); return; }
  if (speaking || streamController) {  // barge-in
    if (streamController) streamController.abort();
    stopSpeaking();
  }
});
</script>
