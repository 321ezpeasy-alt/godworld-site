<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  /* Full-screen looping storefront backdrop */
  #backdrop {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  #shade {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
  }

  /* Business header + contact at the very top. Past this, the page is
     wordless except the avatar's decorative name tag and the one
     order button at the very bottom; the keyword
     terms live in the background watermark art and the page structure
     (title / meta / structured data), never as page copy. */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 3;
    text-align: center;
    padding: 18px 12px 26px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    pointer-events: none;
  }
  header .business-name {
    font-size: clamp(26px, 5.5vw, 44px);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
  }
  header .business-contact {
    margin-top: 4px;
    font-size: clamp(13px, 2.6vw, 17px);
    letter-spacing: 0.08em;
    opacity: 0.92;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  }

  /* Avatar centered over the video: Henry's approved portrait (the
     Nov 13 suit portrait — no braids, no headband, no raised finger)
     with the Nov 13 lip-sync layers: a jaw-masked copy of the portrait
     and a mouth overlay, both driven by applyMouth() while he speaks. */
  #avatar {
    position: fixed;
    left: 50%; bottom: max(86px, 12vh);
    transform: translateX(-50%);
    width: min(62vw, 340px);
    aspect-ratio: 1376 / 1824;
    z-index: 2;
    pointer-events: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    line-height: 0;
  }
  #avatar.speaking { animation: framePulse 2.2s ease-in-out infinite; }
  @keyframes framePulse {
    0%, 100% { box-shadow: 0 0 0 8px rgba(232,193,90,.18), 0 18px 60px rgba(0,0,0,0.55); }
    50% { box-shadow: 0 0 0 13px rgba(232,193,90,.24), 0 18px 60px rgba(0,0,0,0.55); }
  }
  .avatar-stage { display: block; position: absolute; inset: 0; will-change: transform; }
  .avatar-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-stage img.jaw-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 11% 5% at 44.3% 23.2%, #000 50%, transparent 76%);
    mask-image: radial-gradient(ellipse 11% 5% at 44.3% 23.2%, #000 50%, transparent 76%);
    will-change: transform;
  }
  .mouth {
    position: absolute; left: 45.3%; top: 20.2%; width: 7.7%; height: 2.1%;
    transform: translate(-50%,-50%) scale(1.07,.06); opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 36%, #4a1c10 0%, #2c0f08 52%, #140503 100%);
    border-radius: 48% 52% 55% 45% / 62% 66% 38% 40%;
    box-shadow: 0 0 7px 2px rgba(96,44,26,.38), inset 0 -3px 6px rgba(0,0,0,.55);
    overflow: hidden; will-change: transform, opacity;
  }
  .mouth-teeth {
    position: absolute; left: 2%; right: 2%; top: 0; height: 30%; opacity: 0;
    background: linear-gradient(180deg,#ffffff 0%,#efe6da 100%);
    border-radius: 0 0 48% 48% / 0 0 78% 78%;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .mouth-tongue {
    position: absolute; left: 23%; right: 23%; bottom: -10%; height: 54%; opacity: 0;
    background: radial-gradient(ellipse at 50% 100%, #b25747 0%, #8c3a2f 75%);
    border-radius: 50% 50% 0 0;
  }

  /* Name tag on the avatar — one of the two visible-words exceptions
     on this wordless page (the other is the order button at the very
     bottom), as a subtle decorative caption worked into the design
     (real readable text), not a prominent badge. */
  #name-tag {
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    z-index: 2;
    font-size: clamp(12px, 2.4vw, 15px);
    font-style: italic;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.66);
    text-shadow: 0 1px 8px rgba(0,0,0,0.65);
    white-space: nowrap;
  }

  /* Decorative background watermark — theTruth AI, godworld.org, and
     Super Intelligent Designs
     woven into the backdrop art itself, watermark-style: genuinely
     visible as part of the design, kept faint, and carried as real
     page text. No hidden text, no white-on-white. (The page carries
     no seal line or keyword copy; the produced-with-AI statement
     lives in the meta description, in the page structure.) */
  #backdrop-watermark {
    position: fixed; inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  #backdrop-watermark .wm {
    position: absolute;
    font-style: italic;
    font-size: clamp(48px, 11vw, 120px);
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.055);
    transform: rotate(-16deg);
    white-space: nowrap;
  }
  #backdrop-watermark .wm-a { top: 10%; left: 3%; }
  #backdrop-watermark .wm-b { top: 36%; right: 1%; }
  #backdrop-watermark .wm-c { bottom: 24%; left: 9%; }
  #backdrop-watermark .wm-d { bottom: 9%; right: 7%; }
  #backdrop-watermark .wm-e { top: 58%; left: 26%; }
  #backdrop-watermark .wm-f { top: 20%; left: 42%; }
  /* The one order button — fixed at the very bottom of the page,
     below the avatar. Label and Stripe href are exactly the live
     S.I. Designs page's. */
  .prelaunch-order {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 18px; z-index: 260;
    display: inline-block;
    background: #101828; color: #ffffff;
    font-family: Sora, Manrope, sans-serif;
    font-weight: 700; font-size: 16.5px;
    padding: 15px 28px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 16px 40px rgba(16,24,40,.35);
    border: 1px solid #101828;
  }

<script>
'use strict';
/*
  The established storefront frontend (vanilla JS — the React chat component
  from Gemini's draft is gone). There is deliberately:
    - no chat transcript, no text field, no form, nothing to submit;
    - no chips, no counters, no copy: wordless past the header, the
      avatar's name tag, the decorative background watermark, and the
      one order button at the very bottom.
  One tap anywhere enters the store: the mic opens, the avatar greets the
  visitor out loud, and from there it is a continuous hands-free
  conversation — voice in, spoken replies out. Talking while the avatar is
  speaking stops it instantly (barge-in).
*/

const GREETING = "Hi, I'm theTruth AI, the digital twin of Henry theTruth Kennemore, founder of godworld.org.";
const BRAIN_DOWN_LINE = "Sorry — my brain isn't reachable just this second. Give me a moment and ask me again.";

let entered = false;
let sessionId = null;
let recognition = null;
let currentMood = 'idle';
let replyMood = 'idle'; // mood the model chose for the current/last reply as a whole
let speaking = false;
let streamController = null;
const speechQueue = [];
let speechDraining = false;

// --- Avatar: approved portrait + lip sync -----------------------------------
// The face is Henry's approved Nov 13 portrait. While a sentence is being
// spoken, a syllable envelope drives applyMouth() — the same mouth / jaw /
// stage math as the approved page — so the mouth and jaw track the speech;
// when he is silent the mouth settles closed.
const avatarEl = document.getElementById('avatar');
const avatarImg = document.getElementById('avatarImg');

const mouthEl = document.getElementById('mouth');
const mouthTeeth = document.getElementById('mouthTeeth');
const mouthTongue = document.getElementById('mouthTongue');
const avatarStage = document.getElementById('avatarStage');
jawImg.src = avatarImg.src;

function setMood(mood) {
  currentMood = mood || 'idle';
  avatarEl.classList.toggle('smiling', currentMood === 'smiling');
}

const lipAmp = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.4 : 1;
let smoothOpen = 0;
let mouthTarget = 0;
let nextSyllableAt = 0;
function applyMouth(o) {
  const vis = o < 0.04 ? 0 : Math.min(1, o * 2.3);
  mouthEl.style.opacity = vis.toFixed(3);
  const sy = 0.06 + o * 1.12;
  const sx = 1.07 - o * 0.17;
  mouthEl.style.transform = 'translate(-50%,-50%) translateY(' + (o * 12).toFixed(1) + '%) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
  mouthTeeth.style.opacity = o > 0.15 ? Math.min(1, (o - 0.15) * 2.4).toFixed(2) : '0';
  mouthTongue.style.opacity = o > 0.48 ? Math.min(1, (o - 0.48) * 2).toFixed(2) : '0';
  jawImg.style.transform = 'translateY(' + (o * 2.4).toFixed(2) + '%)';
  avatarStage.style.transform = 'translateY(' + (o * 0.7).toFixed(2) + '%) rotate(' + (o * 0.35).toFixed(3) + 'deg)';
}
function lipTick(now) {
  if (speaking) {
    if (now >= nextSyllableAt) {
      mouthTarget = Math.random() < 0.18 ? 0 : 0.25 + Math.random() * 0.7;
      nextSyllableAt = now + 80 + Math.random() * 110;
    }
  } else {
    mouthTarget = 0;
  }
  smoothOpen += (mouthTarget - smoothOpen) * (mouthTarget > smoothOpen ? 0.55 : 0.35);
  if (mouthTarget === 0 && smoothOpen < 0.004) smoothOpen = 0;
  applyMouth(Math.min(0.9, smoothOpen) * lipAmp);
  requestAnimationFrame(lipTick);
}
applyMouth(0);
requestAnimationFrame(lipTick);

// --- Speaking -------------------------------------------------------------
function speak(text) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = resolve;
    utterance.onerror = resolve;
    window.speechSynthesis.speak(utterance);
  });
}

async function drainSpeechQueue() {
  if (speechDraining) return;
  speechDraining = true;
  speaking = true;
  avatarEl.classList.add('speaking');
  while (speechQueue.length > 0) {
    const { text, mood } = speechQueue.shift();
    // The model's mood for this sentence drives the face WHILE it is
    // spoken: a warm sentence is delivered smiling, a normal one talking.
    // (An 'idle'-mood sentence still has words to say, so it is spoken
    // talking — idle itself is the resting state, applied below.)
    setMood(mood === 'smiling' ? 'smiling' : 'talking');
    replyMood = mood;
    await speak(text);
  }
  speaking = false;
  avatarEl.classList.remove('speaking');
  speechDraining = false;
  // Rest at the mood the model chose for the reply as a whole (replyMood,
  // fed by the server's sentence/done lines): a warm finish lingers
  // smiling for a moment before easing back; anything else — including
  // a model-chosen 'idle' — settles to idle right away.
  if (replyMood === 'smiling') {
    setMood('smiling');
    setTimeout(() => { if (!speaking) setMood('idle'); }, 2500);
  } else {
    setMood('idle');
  }
}

function stopSpeaking() {
  speechQueue.length = 0;
  window.speechSynthesis.cancel();
  speaking = false;
  replyMood = 'idle';
  avatarEl.classList.remove('speaking');
  setMood('idle');
}

function answerScripted(message) {

// --- Conversation -----------------------------------------------------------
async function sendChat(message) {
  stopSpeaking();
  if (scriptedMode) { answerScripted(message); return; }
  streamController = new AbortController();
  replyMood = 'talking'; // a reply is in progress; sentence/done lines refine it
  try {
    const res = await fetch('https://godworld-storefront.321ezpeasy.workers.dev/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId }),
      signal: streamController.signal,
    });
    if (!res.ok || !res.body) throw new Error('chat request failed: ' + res.status);
    const headerSession = res.headers.get('X-Session-Id');
    if (headerSession) sessionId = headerSession;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstSentence = true;
    let tookOver = false;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let event;
        try { event = JSON.parse(line); } catch { continue; }
        if (event.type === 'meta' && event.sessionId) sessionId = event.sessionId;
        if (event.type === 'sentence' && event.text) {
          if (firstSentence && event.text.includes('lost my train of thought')) {
            // The brain is out and only the bare apology came back —
            // switch to the built-in script and answer for real.
            scriptedMode = true;
            tookOver = true;
            answerScripted(message);
            break;
          }
          firstSentence = false;
          replyMood = event.mood || replyMood;
          speechQueue.push({ text: event.text, mood: event.mood || 'talking' });
          drainSpeechQueue();
        }
        if (event.type === 'done' && event.mood) replyMood = event.mood;
      }
      if (tookOver) break;
    }
  } catch (err) {
    if (err.name === 'AbortError') return; // barged in — silence is correct
    if (!tookOver) {
      // Brain unreachable — switch to the built-in script and answer anyway.
      scriptedMode = true;
      answerScripted(message);
    }
  } finally {
    streamController = null;
  }
}

// --- Listening --------------------------------------------------------------
function startListening() {
  const RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!RecognitionCtor) return; // no recognition support — tap still greets
  recognition = new RecognitionCtor();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const result = event.results[event.results.length - 1];
    if (!result || !result.isFinal) return;
    const transcript = result[0].transcript.trim();
    if (!transcript) return;
    if (speaking || streamController) {
      // Barge-in: the visitor talked over the avatar — stop everything and
      // take what they just said as the next message.
      if (streamController) streamController.abort();
      stopSpeaking();
    }
    sendChat(transcript);
  };
  recognition.onend = () => {
    // Continuous conversation: keep the mic open while we're in the store.
    if (entered) {
      try { recognition.start(); } catch { /* already running */ }
    }
  };
  recognition.onerror = () => { /* onend restart handles recovery */ };
  try { recognition.start(); } catch { /* already running */ }
}

// --- Entry: ONE tap anywhere --------------------------------------------------
async function enter() {
  if (entered) return;
  entered = true;
  // Ask for the mic (best effort — the greeting plays either way).
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try { await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { /* visitor declined */ }
  }
  // Unlock speech on this gesture, greet with the full identity, then listen.
  speechQueue.push({ text: GREETING, mood: 'smiling' });
  drainSpeechQueue();
  startListening();
}

});
